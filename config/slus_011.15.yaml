name: SLUS_011.15
# Pristine US retail executable, extracted from your own disc by
# tools/extract_baserom.py. A modified or translated executable will not match.
sha1: 07fbcffbdd96080d39939e569f84abe76b9d1039
options:
  basename: slus_011.15
  target_path: baserom/SLUS_011.15
  elf_path: build/slus_011.15.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  create_asm_dependencies: True
  migrate_rodata_to_functions: True

  ld_script_path: build/slus_011.15.ld
  ld_dependencies: True

  # By default splat pads each section/segment end to 16. That rounds the .text
  # end (0x80048B14) up to 0x80048B20, shifting every .data address by +12 and
  # the file length by +16. The real boundaries are already exact, so emit no
  # end-padding at all.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  find_file_boundaries: False
  gp_value: 0x8005E274
  # ld_gp_expression: main_SCOMMON_START + 0x7FF0

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]
  # auto_link_sections: [".data", ".rodata", ".bss"]

  symbol_addrs_path:
    - symbols/symbol_addrs.txt
  reloc_addrs_path:
    - symbols/reloc_addrs.txt

  # Symbols referenced by code but living outside the image (BSS/RAM above
  # 0x8005E800) or mid-symbol. Emitted as `name = 0xaddr;`, which is already
  # valid linker-script syntax, so the Makefile feeds them straight to ld.
  undefined_funcs_auto_path: undefined_funcs_auto.txt
  undefined_syms_auto_path: undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # Uncomment this line if you need to use the maspsx reorder workaround hack
  # https://github.com/mkst/maspsx?tab=readme-ov-file#include_asm-reordering-workaround-hack
  # include_asm_macro_style: maspsx_hack
segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    # bss_size: Please fill out this value when you figure out the bss size
    subsegments:
      # Boundaries reconciled against Ghidra BTN_RE on 2026-09-01:
      #   .rodata 0x800..0x1A70   (vram 0x80010000..0x80011270)
      #     - jumptables + strings; last jumptable entry ends at 0x8001126C
      #   .text   0x1A70..0x3930C (vram 0x80011270..0x80048B0C)
      #     - first function __main @ 0x80011270 (jr ra / nop stub)
      #     - last function PDRESRES_OBJ_1E40 @ 0x80048AE4 ends 0x80048B0C
      #     - 8 bytes of zero padding 0x80048B0C..0x80048B14
      #   .data   0x39314..       (vram 0x80048B14)
      # A jump table must live in the same object file as the code it jumps
      # into. spimdisasm names jump-table targets `.L<addr>`, and GNU as drops
      # every `.L` symbol from the object symbol table even when macro.inc's
      # `jlabel` declares it `.global` -- so a table in a standalone rodata
      # object cannot reference targets inside a `c` unit's object. While the
      # game code was one big `asm` segment splat migrated each table into the
      # same .s file as its function and the question never arose. Now that
      # every unit is a `c` segment, each unit's tables must be declared as a
      # `.rodata` subsegment of that unit (leading dot) so they are emitted
      # into the unit's own object.
      #
      # A unit gets exactly one contiguous `.rodata` run: ld places an input
      # section at its first match only, so two subsegments naming the same
      # object would leave the second empty and shift everything after it.
      # Data whose ownership is shared or unknown stays in a plain `rodata`
      # segment between the owned runs.
      # D_80010000 has no single owning function, so it cannot migrate into
      # one. It is an ordinary global though, and only `.L` symbols fail to
      # resolve across objects, so a plain rodata segment is fine here.
      - [0x800, rodata, 800]         # D_80010000
      - [0x808, .rodata, boot]       # jtbl_80010008
      - [0x85C, .rodata, system]     # jtbl_8001005C
      - [0x878, rodata, 878]         # D_80010078..D_800100A0: archive + shared
      # 0x8B4..0x940 are text's two INCLUDE_ASM'd tables; 0x944 is the switch
      # table func_8001A8D0 emits from real C. One contiguous run either way.
      - [0x8B4, .rodata, text]       # jtbl_800100B4, jtbl_800100DC, jtbl_80010144
      - [0xA1C, rodata, A1C]         # D_8001021C: state_core
      - [0xA24, .rodata, ui]         # jtbl_80010224, D_80010318, D_80010358, jtbl_80010378
      - [0xBB0, rodata, BB0]         # tables targeting the PSY-Q library region
      # Provisional semantic units. These cover the game-owned code
      # contiguously.
      - [0x1A70, c, crt0]
      - [0x1B18, asm, stup0]
      - [0x1B70, c, boot]
      - [0x31F4, c, display]
      - [0x3234, c, system]
